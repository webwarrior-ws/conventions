name: Pi Agent

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pi-agent:
    # HACK: GitHub Actions expressions don't support escape sequences like \n in string literals,
    # so fromJSON('"\n"') is used to inject an actual newline character
    if: |
      contains(fromJson('["knocte", "webwarrior-ws"]'), github.actor) &&
      (startsWith(github.event.comment.body, '/pi ') || contains(github.event.comment.body, format('{0}/pi ', fromJSON('"\n"'))))
    runs-on: ubuntu-24.04
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # workaround for https://github.com/shaftoe/pi-coding-agent-action/issues/413
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Pi agent
        # f7496a9aea9798c5d52d39096d98d5c5b16559b3 = v2.30.0 ( which depends on Pi v1.0.4 )
        uses: tarsgate/pi-coding-agent-action@f7496a9aea9798c5d52d39096d98d5c5b16559b3
        with:
          github_token: ${{ secrets.GH_REPO_BOT_ACCESS_TOKEN }}
          provider: ppq
          model: auto
          token: ${{ secrets.PPQ_API_KEY }}
          extensions: |
            npm:awto-pi-lot
